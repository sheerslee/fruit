server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # index.html 内含中文，显式声明字符集，避免浏览器按默认编码解析
    charset utf-8;

    # demo 每次刷新取最新页面；顺手关掉 MIME 嗅探
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
