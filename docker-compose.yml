services:
  fruit-shop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nginx:1.27-alpine}
    image: fruit-shop:local
    container_name: fruit-shop
    ports:
      # 宿主机端口可用 FRUIT_PORT 覆盖：本机 8080 被其他业务容器占用时换一个即可
      - "${FRUIT_PORT:-8080}:80"
    restart: unless-stopped
